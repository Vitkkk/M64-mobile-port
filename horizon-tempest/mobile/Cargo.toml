# Tempest for Horizon's Android ports: a sandboxed WebAssembly client mod
# (`.hmod`, API horizon:mods 0.1). Build with `tools/build-mobile.sh`.
[package]
name = "tempest-mobile"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { version = "0.60.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
